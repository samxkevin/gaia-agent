name: GAIA Agent Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Import project
        run: |
          python -c 'import agent; import models; import evaluation.client; import evaluation.debug; print("imports: OK")'

      - name: Run regression tests
        run: python -m pytest -q tests/test_video_tool.py tests/test_adversal.py

  live_first_question:
    if: github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    env:
      COHERE_PRIMARY_API_KEY: ${{ secrets.COHERE_PRIMARY_API_KEY }}
      COHERE_FALLBACK_API_KEY: ${{ secrets.COHERE_FALLBACK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Cohere keys
        run: |
          if [ -z "$COHERE_PRIMARY_API_KEY" ]; then
            echo "COHERE_PRIMARY_API_KEY is not configured."
            exit 1
          fi
          if [ -z "$COHERE_FALLBACK_API_KEY" ]; then
            echo "Warning: COHERE_FALLBACK_API_KEY is not configured. Continuing with one key."
          fi

      - name: Run first GAIA question
        run: python -m evaluation.debug --index 0 --expected 3
